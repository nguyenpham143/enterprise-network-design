  - {hostname: HCMC-EDGE-RTR01,  ip: 10.10.255.1, device_type: cisco_ios, port: 22, vlans: []}
  - {hostname: HANOI-RND-RTR01,  ip: 10.20.255.1, device_type: cisco_ios, port: 22, vlans: []}
